<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>90 Days Challenge</title>
<meta name="description" content="Daily DSA, learning and career-prep progress for a 90-day push.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ff4fd8'/><text y='13' x='2' font-size='12'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="style.css?v='+Date.now()+'">')</script>
</head><body>
<canvas id="stars"></canvas><canvas id="confetti"></canvas>
<main>
  <header>
    <div><h1 id="title">90 DAYS</h1><p class="tag" id="tag"></p></div>
    <button class="theme" id="themeBtn" aria-label="Switch theme">THEME</button>
  </header>

  <section class="box hud">
    <div class="herowrap" id="herowrap"><canvas id="hero" width="16" height="16"></canvas></div>
    <div>
      <div class="bubble" id="bubble">…</div>
      <div class="stats" id="stats"></div>
      <div class="xp"><div class="lbl"><span id="lvl"></span><span id="xpn"></span></div><div class="bar"><div class="fill xpf" id="xpfill" style="width:0"></div></div></div>
    </div>
  </section>

  <section class="box"><h2>TODAY'S QUESTS <small id="daytype"></small></h2><div class="quests" id="quests"></div><div class="dayline" id="dayline"></div></section>

  <section class="box">
    <h2>THE TRACKER <small>tap a day</small></h2>
    <div class="dsa-top"><span class="big" id="dsaBig">0/100</span><span id="dsaPct"></span></div>
    <div class="bar goalbar"><div class="fill" id="goalfill" style="width:0"></div><div class="pacemark" id="pacemark" title="where you should be"></div></div>
    <div class="pace-msg" id="pace"></div>
    <div class="cal" id="cal"></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>gold</span><span><i style="background:var(--silver)"></i>silver</span><span><i style="background:var(--bronze)"></i>bronze</span><span><i style="background:var(--miss)"></i>missed</span><span><i style="background:var(--frozen)"></i>frozen</span><span><b class="pip Easy"></b><b class="pip Medium"></b><b class="pip Hard"></b> problems solved</span></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="box"><h2>ACHIEVEMENTS <small id="bcount"></small></h2><div class="next" id="next"></div><div class="badges" id="badges"></div></section>


  <footer id="foot"></footer>
</main>
<script>document.write('<script src="app.js?v='+Date.now()+'"><\/script>')</script>
</body></html>
