<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>90 Days Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1c2c;--panel:#262b44;--ink:#f4f4f4;--dim:#8b93b8;--accent:#ffcd75;--good:#38b764;--silver:#c0cbdc;--gold:#ffcd75;--bronze:#b97a56;--miss:#3a2a3a;--future:#2d3250;--frozen:#41a6f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:11px/1.7 "Press Start 2P",ui-monospace,monospace;image-rendering:pixelated}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(14px,3.6vw,22px);margin:6px 0;color:var(--accent);text-shadow:3px 3px 0 #000}
.tag{color:var(--dim);font-size:9px;margin:0 0 18px}
.box{background:var(--panel);border:4px solid #000;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff1;padding:14px;margin-bottom:16px}
.box h2{font-size:10px;margin:0 0 10px;color:var(--accent)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
canvas{width:96px;height:96px;image-rendering:pixelated;background:#0003;border:3px solid #000;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;flex:1}
.stat b{display:block;font-size:18px;color:var(--ink)}.stat span{color:var(--dim);font-size:8px}
.flame{display:inline-block;animation:flick .4s steps(2) infinite}@keyframes flick{50%{transform:scale(1.15) rotate(-6deg)}}
.bar{height:22px;background:#0006;border:3px solid #000;position:relative}
.fill{height:100%;background:repeating-linear-gradient(90deg,var(--good) 0 8px,#2c8f4f 8px 10px)}
.mark{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--accent)}
.sub{color:var(--dim);font-size:8px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.tile{aspect-ratio:1;background:var(--future);border:2px solid #000;font-size:0}
.tile.bronze{background:var(--bronze)}.tile.silver{background:var(--silver)}.tile.gold{background:var(--gold);animation:tw 1.6s steps(2) infinite}
.tile.none{background:var(--miss)}.tile.frozen{background:var(--frozen)}.tile.today{outline:3px solid var(--ink)}
@keyframes tw{50%{filter:brightness(1.3)}}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:8px;color:var(--dim)}.legend i{display:inline-block;width:10px;height:10px;border:2px solid #000;margin-right:4px}
.quest{display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px dashed #0006}.quest.done{color:var(--good)}
.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{width:64px;text-align:center;font-size:7px}.badge div{font-size:22px;background:#0005;border:3px solid #000;padding:8px 0;margin-bottom:4px}
.badge.locked{opacity:.3;filter:grayscale(1)}
.log{font-size:9px}.log div{padding:4px 0;border-bottom:2px dashed #0006}.log em{color:var(--dim);font-style:normal}
footer{color:var(--dim);font-size:8px;text-align:center;margin-top:24px}
</style></head><body><main>
<h1 id="title">…</h1><p class="tag" id="tag"></p>
<div class="box hero"><canvas id="hero" width="16" height="16"></canvas>
  <div class="stats" id="stats"></div></div>
<div class="box"><h2>TODAY'S QUESTS</h2><div id="quests"></div></div>
<div class="box"><h2 id="dsaTitle">DSA QUEST</h2><div class="bar"><div class="fill" id="fill"></div><div class="mark" id="mark"></div></div><div class="sub" id="dsaSub"></div></div>
<div class="box"><h2>90-DAY MAP</h2><div class="grid" id="grid"></div>
  <div class="legend"><span><i style="background:var(--gold)"></i>gold</span><span><i style="background:var(--silver)"></i>silver</span><span><i style="background:var(--bronze)"></i>bronze</span><span><i style="background:var(--miss)"></i>missed</span><span><i style="background:var(--frozen)"></i>frozen</span></div></div>
<div class="box"><h2>BADGES</h2><div class="badges" id="badges"></div></div>
<div class="box"><h2>LEARNING LOG</h2><div class="log" id="log"></div></div>
<footer id="foot"></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(u){const r=await fetch(u+'?t='+Date.now());return r.json()}
// 16x16 hero: rows of palette indices; hat colour changes with level
const SPR=["................","......2222......",".....222222.....",".....333333.....",".....3433443....".slice(0,16),".....333333.....",".....355553.....","......3333......",".....666666.....","....66666666....","....66666666....","....66666666....",".....77..77.....",".....77..77.....",".....88..88.....","................"];
function hero(level){const c=$('hero').getContext('2d');c.clearRect(0,0,16,16);
  const hat=['#b13e53','#ef7d57','#ffcd75','#38b764','#41a6f6','#5d275d'][Math.min(Math.floor((level-1)/2),5)];
  const P={'2':hat,'3':'#f4cca1','4':'#1a1c2c','5':'#b86f50','6':'#3b5dc9','7':'#333c57','8':'#000'};
  SPR.forEach((row,y)=>[...row].forEach((ch,x)=>{if(P[ch]){c.fillStyle=P[ch];c.fillRect(x,y,1,1)}}))}
(async()=>{
 const [cf,p]=await Promise.all([j('config.json'),j('public.json')]);
 for(const [k,v] of Object.entries(cf.palette))document.documentElement.style.setProperty('--'+k,v);
 document.title=cf.title;$('title').textContent=cf.title;$('tag').textContent=cf.tagline;
 hero(p.level);
 const dayTxt=p.started?`${Math.min(p.day_number,p.total_days)}/${p.total_days}`:'SOON';
 $('stats').innerHTML=[[cf.labels.level,p.level],['DAY',dayTxt],[cf.labels.streak,(p.streak>0?'<span class="flame">🔥</span>':'')+p.streak],['BEST',p.best_streak],['XP',p.xp]]
   .map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
 const t=p.today,q=[['dsa',cf.labels.dsa],['learn',cf.labels.learn],['tech',cf.labels.tech]];
 $('quests').innerHTML=q.map(([k,l])=>{const need=t.targets[k]??1,d=t.done[k]||0,ok=d>=need;return `<div class="quest ${ok?'done':''}"><span>${ok?'■':'□'} ${l}</span><span>${d}/${need}</span></div>`}).join('')
   +`<div class="sub">${esc(t.type.replace('_',' '))} day${p.streak_at_risk?' · streak at risk!':''}</div>`;
 const pct=Math.min(100,p.dsa.solved/p.dsa.goal*100);$('fill').style.width=pct+'%';$('mark').style.left=Math.min(100,p.dsa.ideal_by_today/p.dsa.goal*100)+'%';
 $('dsaTitle').textContent=cf.labels.dsa+`  ${p.dsa.solved}/${p.dsa.goal}`;
 const df=Object.entries(p.dsa.difficulty||{}).map(([k,v])=>`${k[0]}:${v}`).join(' ');
 $('dsaSub').textContent=`pace ${p.dsa.ahead_by>=0?'+':''}${p.dsa.ahead_by} vs plan · need ${p.dsa.needed_per_day}/day · ${df}`;
 const byDay=Object.fromEntries(p.days.map(d=>[d.day,d]));let g='';
 for(let i=1;i<=p.total_days;i++){const d=byDay[i];const cls=d?d.rating:'';g+=`<div class="tile ${cls} ${i===p.day_number?'today':''}" title="Day ${i}${d?' · '+d.rating:''}">${i}</div>`}
 $('grid').innerHTML=g;
 $('badges').innerHTML=Object.keys(cf.badge_names).map(id=>`<div class="badge ${p.badges.includes(id)?'':'locked'}"><div>${cf.badge_glyph[id]||'★'}</div>${esc(cf.badge_names[id])}</div>`).join('');
 $('log').innerHTML=p.learning.length?p.learning.map(x=>`<div><em>${x.date.slice(5)} [${esc(x.tag||'-')}]</em> ${esc(x.topic)}${x.takeaway?'<br><em>'+esc(x.takeaway)+'</em>':''}</div>`).join(''):'<div><em>nothing logged yet. Day 1 awaits.</em></div>';
 $('foot').textContent='updated '+p.generated.replace('T',' ').slice(0,16)+' IST';
})().catch(e=>{document.body.insertAdjacentHTML('beforeend','<p>could not load data: '+esc(e.message)+'</p>')});
</script></main></body></html>
