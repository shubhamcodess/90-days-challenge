name: Auto-merge routine branches

# The Claude routine can only push to claude/* branches (403 on main) and its
# sandbox has no gh CLI. So it just pushes the branch; this workflow opens the PR,
# validates, and squash-merges it.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: routine-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python3 -m py_compile scripts/*.py
          for f in config/*.json config/pillars/*.json docs/*.json data/state.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          if git grep -qiE 'ingka' -- . ':!.github'; then echo "work-identity leak found"; exit 1; fi
      - name: Open PR (if none) and merge
        run: |
          BR="${GITHUB_REF_NAME}"
          N=$(gh pr list --head "$BR" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then
            gh pr create --base main --head "$BR" --title "routine: $BR" --body "Automated routine state update." 
            N=$(gh pr list --head "$BR" --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$N" --squash --delete-branch
